<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Remote Voice</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #0d0f14;
      --card: #151922;
      --card-2: #0f131b;
      --text: #f5f7fb;
      --muted: #9aa4b2;
      --border: #272e3a;
      --accent: #7c8cff;
      --green: #40d787;
      --yellow: #e8d85a;
      --red: #ff5f67;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #171c2a 0, transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(100%, 430px);
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: rgba(21, 25, 34, 0.96);
      box-shadow: 0 22px 70px rgba(0,0,0,.35);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: var(--accent);
      font-size: 23px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -0.6px;
    }

    .subtitle {
      margin: 0 0 22px 58px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 15px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 17px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #667080;
    }

    .dot.active {
      background: var(--green);
      box-shadow: 0 0 15px rgba(64, 215, 135, .7);
    }

    .meter {
      height: 16px;
      margin: 18px 0 24px;
      overflow: hidden;
      border-radius: 999px;
      background: #090b0f;
      border: 1px solid #202632;
    }

    .meter-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
      transition: width .05s linear;
    }

    .control {
      margin-top: 19px;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 9px;
      font-size: 14px;
    }

    .value { color: var(--muted); }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
      margin-top: 25px;
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 17px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform .12s ease, opacity .12s ease;
    }

    button:active { transform: scale(.98); }

    #startBtn {
      background: var(--accent);
      color: white;
    }

    #muteBtn {
      background: #272d39;
      color: white;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .warning {
      margin-top: 18px;
      padding: 13px 14px;
      border: 1px solid #504522;
      border-radius: 15px;
      background: #241f12;
      color: #f2d77b;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .error {
      min-height: 20px;
      margin-top: 13px;
      color: #ff858b;
      font-size: 13px;
    }

    @media (max-width: 390px) {
      .buttons { grid-template-columns: 1fr; }
      .subtitle { margin-left: 0; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand">
      <div class="logo">🎙️</div>
      <h1>Remote Voice</h1>
    </div>

    <p class="subtitle">Escute em tempo real tudo que o microfone do dispositivo estiver captando.</p>

    <div class="status">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Desligado</span>
    </div>

    <div id="deviceHint" style="margin-top:10px;color:#9aa4b2;font-size:12px;line-height:1.4">
      No celular, conecte o fone antes de tocar em “Começar a ouvir”.
    </div>

    <div class="meter" aria-label="Nível do microfone">
      <div class="meter-fill" id="meterFill"></div>
    </div>

    <div class="control">
      <label for="volume">
        <span>Volume da saída</span>
        <span class="value" id="volumeValue">100%</span>
      </label>
      <input id="volume" type="range" min="0" max="2" step="0.01" value="1" />
    </div>

    <div class="control">
      <label for="gain">
        <span>Sensibilidade do microfone</span>
        <span class="value" id="gainValue">100%</span>
      </label>
      <input id="gain" type="range" min="0" max="4" step="0.01" value="1" />
    </div>

    <div class="buttons">
      <button id="startBtn" type="button">Começar a ouvir</button>
      <button id="muteBtn" type="button" disabled>Mutar</button>
    </div>

    <div class="warning">
      🎧 Use fone de ouvido. Se tocar pelo alto-falante, o microfone pode ouvir a própria saída e criar feedback.
    </div>

    <div class="error" id="errorText" aria-live="polite"></div>
  </main>

  <script>
    const startBtn = document.getElementById("startBtn");
    const muteBtn = document.getElementById("muteBtn");
    const volumeSlider = document.getElementById("volume");
    const gainSlider = document.getElementById("gain");
    const volumeValue = document.getElementById("volumeValue");
    const gainValue = document.getElementById("gainValue");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const errorText = document.getElementById("errorText");
    const meterFill = document.getElementById("meterFill");

    let audioContext = null;
    let stream = null;
    let source = null;
    let micGain = null;
    let outputGain = null;
    let analyser = null;
    let animationFrame = null;
    let isRunning = false;
    let isMuted = false;

    async function startListening() {
      errorText.textContent = "";

      if (!navigator.mediaDevices?.getUserMedia) {
        errorText.textContent = "Este navegador não suporta acesso ao microfone.";
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        // Em iPhone/iPad, o Safari pode capturar o microfone mas rotear
        // a reprodução para a saída errada. Quando disponível, esta configuração
        // força uma sessão própria para captura + reprodução.
        try {
          if (navigator.audioSession) {
            navigator.audioSession.type = "auto";
          }
        } catch (_) {}

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();

        try {
          if (navigator.audioSession) {
            navigator.audioSession.type = "play-and-record";
          }
        } catch (_) {}

        source = audioContext.createMediaStreamSource(stream);
        micGain = audioContext.createGain();
        outputGain = audioContext.createGain();
        analyser = audioContext.createAnalyser();

        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.75;

        micGain.gain.value = Number(gainSlider.value);
        outputGain.gain.value = Number(volumeSlider.value);

        source.connect(micGain);
        micGain.connect(analyser);
        analyser.connect(outputGain);
        outputGain.connect(audioContext.destination);

        isRunning = true;
        isMuted = false;

        startBtn.textContent = "Parar";
        muteBtn.disabled = false;
        muteBtn.textContent = "Mutar";
        statusDot.classList.add("active");
        statusText.textContent = "Ouvindo";

        updateMeter();
      } catch (error) {
        console.error(error);

        if (error.name === "NotAllowedError") {
          errorText.textContent = "Permissão do microfone negada.";
        } else if (error.name === "NotFoundError") {
          errorText.textContent = "Nenhum microfone foi encontrado.";
        } else {
          errorText.textContent = "Não foi possível iniciar o microfone.";
        }
      }
    }

    async function stopListening() {
      if (animationFrame) cancelAnimationFrame(animationFrame);

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      if (audioContext && audioContext.state !== "closed") {
        await audioContext.close();
      }

      // Restaura o roteamento normal no iOS ao parar.
      try {
        if (navigator.audioSession) {
          navigator.audioSession.type = "playback";
          navigator.audioSession.type = "auto";
        }
      } catch (_) {}

      audioContext = null;
      stream = null;
      source = null;
      micGain = null;
      outputGain = null;
      analyser = null;
      animationFrame = null;

      isRunning = false;
      isMuted = false;

      startBtn.textContent = "Começar a ouvir";
      muteBtn.disabled = true;
      muteBtn.textContent = "Mutar";
      statusDot.classList.remove("active");
      statusText.textContent = "Desligado";
      meterFill.style.width = "0%";
    }

    function updateMeter() {
      if (!analyser || !isRunning) return;

      const data = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(data);

      let sumSquares = 0;

      for (const sample of data) {
        const normalized = (sample - 128) / 128;
        sumSquares += normalized * normalized;
      }

      const rms = Math.sqrt(sumSquares / data.length);
      const percent = Math.min(100, rms * 360);

      meterFill.style.width = percent + "%";
      animationFrame = requestAnimationFrame(updateMeter);
    }

    startBtn.addEventListener("click", async () => {
      if (isRunning) {
        await stopListening();
      } else {
        await startListening();
      }
    });

    muteBtn.addEventListener("click", () => {
      if (!outputGain) return;

      isMuted = !isMuted;

      if (isMuted) {
        outputGain.gain.value = 0;
        muteBtn.textContent = "Desmutar";
        statusText.textContent = "Mutado";
      } else {
        outputGain.gain.value = Number(volumeSlider.value);
        muteBtn.textContent = "Mutar";
        statusText.textContent = "Ouvindo";
      }
    });

    volumeSlider.addEventListener("input", () => {
      const value = Number(volumeSlider.value);
      volumeValue.textContent = Math.round(value * 100) + "%";

      if (outputGain && !isMuted) {
        outputGain.gain.value = value;
      }
    });

    gainSlider.addEventListener("input", () => {
      const value = Number(gainSlider.value);
      gainValue.textContent = Math.round(value * 100) + "%";

      if (micGain) {
        micGain.gain.value = value;
      }
    });

    window.addEventListener("pagehide", () => {
      if (stream) stream.getTracks().forEach(track => track.stop());
    });
  </script>
</body>
</html>
